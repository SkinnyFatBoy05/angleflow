name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - run: dotnet restore AngleFlow.sln
      - run: dotnet test AngleFlow.sln --configuration Release --no-restore --collect:"XPlat Code Coverage"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  delivery-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api worker web
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/angleflow-k8s.yaml
      - name: Compile Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/azure/main.bicep --outfile /tmp/angleflow-arm.json
