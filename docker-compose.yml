name: angleflow

services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.16}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.16}
    ports:
      - "8080:8080"
      - "26500:26500"
      - "9600:9600"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+PrintFlagsFinal"
    mem_limit: 1g
    restart: unless-stopped
    volumes:
      - camunda-primary:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./docker/camunda/application-h2.yaml:/usr/local/camunda/config/application.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 35s
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: angleflow
      POSTGRES_USER: angleflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-angleflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angleflow -d angleflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/AngleFlow.Api/Dockerfile
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AngleFlow: "Host=postgres;Port=5432;Database=angleflow;Username=angleflow;Password=${POSTGRES_PASSWORD:-angleflow_dev}"
      CAMUNDA_REST_ADDRESS: http://orchestration:8080
      CAMUNDA_AUTH_STRATEGY: NONE
      CAMUNDA_SDK_LOG_LEVEL: info
      AllowedOrigins__0: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      orchestration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/AngleFlow.Worker/Dockerfile
    environment:
      ConnectionStrings__AngleFlow: "Host=postgres;Port=5432;Database=angleflow;Username=angleflow;Password=${POSTGRES_PASSWORD:-angleflow_dev}"
      CAMUNDA_REST_ADDRESS: http://orchestration:8080
      CAMUNDA_AUTH_STRATEGY: NONE
      CAMUNDA_SDK_LOG_LEVEL: info
      CAMUNDA_WORKER_TIMEOUT: "30000"
    depends_on:
      api:
        condition: service_healthy
      orchestration:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  camunda-primary:
  camunda-data:
  postgres-data:
