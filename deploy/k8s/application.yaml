apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: angleflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: angleflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: angleflow-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: angleflow-api:dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: angleflow-config
            - secretRef:
                name: angleflow-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: angleflow
spec:
  selector:
    app.kubernetes.io/name: angleflow-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: angleflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: angleflow-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: angleflow-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: angleflow-worker:dev
          envFrom:
            - configMapRef:
                name: angleflow-config
            - secretRef:
                name: angleflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: angleflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: angleflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: angleflow-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: angleflow-web:dev
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: angleflow
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: angleflow-web
  ports:
    - name: http
      port: 80
      targetPort: http
