# Example only. Prefer Azure Key Vault + Secrets Store CSI Driver in shared environments.
apiVersion: v1
kind: Secret
metadata:
  name: angleflow-secrets
  namespace: angleflow
type: Opaque
stringData:
  ConnectionStrings__AngleFlow: Host=REPLACE.postgres.database.azure.com;Port=5432;Database=angleflow;Username=angleflowadmin;Password=REPLACE;Ssl Mode=Require
  CAMUNDA_BASIC_AUTH_USERNAME: demo
  CAMUNDA_BASIC_AUTH_PASSWORD: REPLACE
